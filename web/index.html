<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pasta — private sharing</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="site-header"><a class="brand" href="/">pasta<span>://</span></a></header>
  <main class="home">
    <section class="composer card" aria-label="New paste">
      <form id="create-form">
        <label class="field-label" for="text">Text</label>
        <textarea id="text" maxlength="1048576"></textarea>
        <input id="files" class="visually-hidden" type="file" multiple>
        <label class="upload-zone" for="files"><strong>Files</strong><span id="file-summary" class="visually-hidden"></span></label>
        <ul id="file-list" class="file-list" aria-live="polite"></ul>
        <div class="settings">
          <label class="select-field" for="ttl"><span>Expires in</span><select id="ttl"><option value="1">1 hour</option><option value="24">1 day</option><option value="168" selected>7 days</option><option value="720">30 days</option></select></label>
          <label class="burn-option" for="burn"><input id="burn" type="checkbox"><span><strong>One-time paste</strong></span></label>
        </div>
        <button class="primary create-button" type="submit">Create link <span aria-hidden="true">→</span></button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
    </section>
    <section id="result" class="result card" hidden aria-labelledby="result-title">
      <div class="result-heading"><h2 id="result-title">Ready</h2><span class="success-mark" aria-hidden="true">✓</span></div>
      <div class="link-card recipient-link"><strong>Recipient</strong><label class="visually-hidden" for="public-link">Recipient link</label><div class="copy-row"><input id="public-link" readonly><button class="secondary" data-copy="public-link">Copy</button></div><button id="show-qr" class="text-button" type="button">QR code</button><div id="qr" hidden></div></div>
      <div class="link-card delete-link"><strong>Delete</strong><label class="visually-hidden" for="delete-link">Delete link</label><div class="copy-row"><input id="delete-link" readonly><button class="secondary" data-copy="delete-link">Copy</button></div></div>
    </section>
    <p id="statistics" class="statistics" hidden aria-live="polite"></p>
  </main>
  <script src="/static/qrcode.js"></script>
  <script type="module" src="/static/create.js"></script>
</body>
</html>
